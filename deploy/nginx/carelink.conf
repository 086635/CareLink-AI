# CareLink-AI 智护无忧 · Nginx 配置示例
# 部署位置：/etc/nginx/conf.d/carelink.conf（证书路径按实际环境调整）

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/carelink.crt;
    ssl_certificate_key /etc/nginx/ssl/carelink.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # 后端 API 反代（NestJS，PM2 集群监听 3000）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 升级透传（Socket.IO /ws 命名空间）
    location /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # PC 管理端静态资源（web-admin 构建产物）
    location / {
        root /opt/carelink/web-admin;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # 护理员 H5 静态资源（h5-caregiver 构建产物，base=/h5/）
    location /h5/ {
        alias /opt/carelink/h5-caregiver;
        try_files $uri $uri/ /h5/index.html;
        expires 1h;
    }
}